[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

# /admin and /sales are SPA routes served by the single-file app.
# Rewrite (status 200) so the URL bar stays clean instead of redirecting.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sales"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sales/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self';"

# Cache content file briefly so admin sees updates fast,
# but visitors don't hammer the server.
[[headers]]
  for = "/site-content.json"
  [headers.values]
    Cache-Control = "public, max-age=30, must-revalidate"

# Force browsers to re-check index.html on every visit so deploys
# show up immediately on desktop and mobile (no stale HTML cache).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
